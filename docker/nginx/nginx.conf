worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 30s;

  server_tokens off;
  client_max_body_size 4m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  # Limite globale par adresse, en plus de celles de l'application.
  limit_req_zone $binary_remote_addr zone=par_ip:10m rate=150r/s;
  # Parties en direct : chaque écran demande l'état une fois par seconde. Une classe entière
  # derrière la même adresse (réseau d'établissement) doit passer : 200 joueurs au plus.
  limit_req_zone $binary_remote_addr zone=direct:10m rate=250r/s;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Produit au démarrage depuis modeles/cyberhoot.conf.template (variables d'environnement).
  include /tmp/cyberhoot.conf;
}
