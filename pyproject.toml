[project]
name = "cyberhoot"
version = "2.2.0"
description = "Plateforme de quiz de sensibilisation à la cybersécurité"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
# Flask-Login n'est pas typé : ses décorateurs (login_required, user_loader) rendraient
# chaque vue « non typée » aux yeux de mypy.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["flask_wtf.*", "wtforms.*", "flask_login.*", "flask_limiter.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
