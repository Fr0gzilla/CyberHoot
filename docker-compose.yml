# Pile complète : seul Nginx publie un port, sur la boucle locale par défaut.
# La base et Redis ne sont joignables que depuis le réseau interne.
name: cyberhoot

services:
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/cyberhoot.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks: [front]
    restart: unless-stopped

  app:
    build:
      context: .
      target: production
    image: cyberhoot:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      SECRET_KEY_FILE: /run/secrets/secret_key
      DB_HOST: db
      DB_NAME: cyberhoot
      DB_USER: cyberhoot
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_URL: redis://redis:6379/0
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Essai local en HTTP : les cookies « Secure » ne passeraient pas. À laisser à true
      # dès que le site est servi en HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAIL_BACKEND: ${MAIL_BACKEND:-console}
      MAIL_FROM: ${MAIL_FROM:-CyberHoot <no-reply@cyberhoot.local>}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    secrets: [secret_key, db_password]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [front, back]
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cyberhoot
      MYSQL_USER: cyberhoot
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [back]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    networks: [back]
    restart: unless-stopped

secrets:
  secret_key:
    file: ./secrets/secret_key
  db_password:
    file: ./secrets/db_password
  db_root_password:
    file: ./secrets/db_root_password

volumes:
  db-data:

networks:
  front:
  back:
    internal: true
