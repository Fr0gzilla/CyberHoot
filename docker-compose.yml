# Pile complète : seul Nginx publie des ports (HTTP qui redirige, HTTPS), sur la boucle
# locale par défaut.
# La base et Redis ne sont joignables que depuis le réseau interne.
name: cyberhoot

services:
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
      - "${HTTP_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
    # Dossier monté (et non fichier par fichier) : une configuration modifiée est bien vue
    # au redémarrage, même quand l'éditeur remplace le fichier.
    command: ["nginx", "-c", "/etc/nginx/cyberhoot/nginx.conf", "-g", "daemon off;"]
    environment:
      # L'image Nginx remplit les gabarits de ce dossier au démarrage.
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/cyberhoot/modeles
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
      # Port ajouté aux redirections HTTP → HTTPS (vide si HTTPS est servi sur le port 443).
      HTTPS_SUFFIXE: ${HTTPS_SUFFIXE-:8443}
    volumes:
      - ./docker/nginx:/etc/nginx/cyberhoot:ro
      # Certificat et clé : auto-signés par `make secrets` en local, voir docs/https.md.
      - ./secrets/tls:/etc/nginx/tls:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks: [front]
    restart: unless-stopped

  app:
    build:
      context: .
      target: production
    image: cyberhoot:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      SECRET_KEY_FILE: /run/secrets/secret_key
      DB_HOST: db
      DB_NAME: cyberhoot
      DB_USER: cyberhoot
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_URL: redis://redis:6379/0
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost:8443}
      # Le site n'est servi qu'en HTTPS : cookies « Secure » (false seulement pour un essai
      # sans le proxy).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MAIL_BACKEND: ${MAIL_BACKEND:-console}
      MAIL_FROM: ${MAIL_FROM:-CyberHoot <no-reply@cyberhoot.local>}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SCAN_BACKEND: ${SCAN_BACKEND:-simule}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      RUN_MIGRATIONS: "1"
    secrets: [secret_key, db_password]
    volumes:
      - uploads:/data/uploads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [front, back]
    restart: unless-stopped

  # Analyse antivirus des images envoyées, en tâche de fond (même image que l'application).
  worker:
    image: cyberhoot:latest
    depends_on:
      app:
        condition: service_healthy
    command: ["flask", "--app", "wsgi", "analyser-medias", "--boucle"]
    environment:
      APP_ENV: production
      SECRET_KEY_FILE: /run/secrets/secret_key
      DB_HOST: db
      DB_NAME: cyberhoot
      DB_USER: cyberhoot
      DB_PASSWORD_FILE: /run/secrets/db_password
      SCAN_BACKEND: ${SCAN_BACKEND:-simule}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      RUN_MIGRATIONS: "0"
    secrets: [secret_key, db_password]
    volumes:
      - uploads:/data/uploads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    # Réseau interne pour la base ; « front » seulement pour joindre VirusTotal si activé.
    networks: [front, back]
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cyberhoot
      MYSQL_USER: cyberhoot
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [back]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    networks: [back]
    restart: unless-stopped

secrets:
  secret_key:
    file: ./secrets/secret_key
  db_password:
    file: ./secrets/db_password
  db_root_password:
    file: ./secrets/db_root_password

volumes:
  db-data:
  uploads:

networks:
  front:
  back:
    internal: true
